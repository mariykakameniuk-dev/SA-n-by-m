<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Набори Sisters Aroma</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="autumn-cat" aria-hidden="true">

  <div class="cat-paws">
    <span class="cat-paw">🐾</span>
    <span class="cat-paw">🐾</span>
  </div>

  <div class="cat-face">
    <div class="cat-ear cat-ear-left"></div>
    <div class="cat-ear cat-ear-right"></div>

    <div class="cat-eyes">
      <span></span>
      <span></span>
    </div>

    <div class="cat-cheeks">
      <span></span>
      <span></span>
    </div>

    <div class="cat-nose"></div>
    <div class="cat-mouth">⌣</div>

    <div class="cat-scarf"></div>
  </div>

</div>


<div id="autumn-leaves" aria-hidden="true"></div>
 
  
<button class="dark-toggle" onclick="toggleDarkMode()">🌙</button>

<div class="container">

  <h1>Набори Sisters Aroma</h1>
  <div class="sub">Всі готові набори зі знижками</div>

  <div class="sticky-bar">

    <input class="search" type="text" id="search" placeholder="Пошук набору...">

    <div class="top-controls">
      <select id="columnsSelect">
        <option value="2">2 набори в ряд</option>
        <option value="3">3 набори в ряд</option>
        <option value="4" selected>4 набори в ряд</option>
        <option value="5">5 наборів в ряд</option>
        <option value="6">6 наборів в ряд</option>
      </select>
    </div>

    <div class="buttons">
      <button onclick="filterTag('all')">Усі</button>
      <button onclick="filterTag('крем')">Крем</button>
      <button onclick="filterTag('парфум')">Парфум</button>
      <button onclick="filterTag('міст')">Міст</button>
      <button onclick="filterTag('лосьйон')">Лосьйон</button>
      <button onclick="filterTag('гель')">Гель</button>
      <button onclick="filterTag('диф')">Дифузор</button>
      <button onclick="filterTag('мило')">Мило</button>
      <button onclick="filterTag('весняні')">Подарункові🌸</button>
    </div>

  </div>

  <div class="grid" id="products"></div>

</div>

<script src="script.js"></script>

</body>

  
</html>
